server {
    listen 80;
    server_name muxidali.com www.muxidali.com;

    return 301 https://muxidali.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name muxidali.com www.muxidali.com;

    root /data/dreamisland;
    index index.html;

    add_header Content-Signal "search=yes, ai-input=yes, ai-train=no" always;

    ssl_certificate /etc/letsencrypt/live/muxidali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muxidali.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/enquiries {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Host itinerary.wildroadgroup.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
